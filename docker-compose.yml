# Hosted Forge API/orchestrator — the compose project that runs carbon-forge-adhoc on
# super-server. This file IS the deployed runtime config: the box checkout
# (C:\Programming\CarbonForge-src) runs the stack from here, so `deployer__ship
# {project:"carbon-forge"}` can pull + build + recreate it (standard compose-build
# recipe). `.env` (gitignored) must sit next to this file on the box — it carries
# FORGE_TOKEN, GEMINI/ELEVENLABS keys, CIFS_USERNAME/CIFS_PASSWORD, and the
# FORGE_*_URL worker endpoints (GPU generation stays on laybackrig/maingamingrig).
#
# docker-compose.forge.yml (forge+chatterbox, local-bind workspace) remains the
# GPU-box/dev variant; THIS file is the super-server production shape.
name: carbon-forge
services:
  forge:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: carbon-forge-mcp:latest
    container_name: carbon-forge-adhoc
    ports:
      - "5125:5125"
    env_file: .env
    volumes:
      - forge-models:/models
      - forge-results:/results
      - workspace:/workspace
    restart: unless-stopped
volumes:
  forge-models:
  forge-results:
  workspace:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${CIFS_USERNAME},password=${CIFS_PASSWORD},vers=3.0,addr=192.168.0.35,file_mode=0666,dir_mode=0777"
      device: "//192.168.0.35/Workspace"
